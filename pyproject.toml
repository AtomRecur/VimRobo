[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vimrobo"
version = "0.1.0"
description = "Spatio-temporal retrieval and reasoning over embodied experience"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "numpy>=1.26,<3", "Pillow>=10,<13", "json5>=0.9"]

[project.scripts]
vimrobo-build = "vimrobo.memory.cli:main"
vimrobo-ask = "vimrobo.inference.cli:main"

[tool.setuptools]
packages = ["vimrobo.memory", "vimrobo.inference"]
package-dir = {"vimrobo.memory" = "memory", "vimrobo.inference" = "inference"}
